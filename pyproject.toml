[project]
name = "momo_pytest_demo"
version = "0.1.0"
description = "Demo framework for pytest + Playwright"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.40.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
python_files = ["test_*.py"]
